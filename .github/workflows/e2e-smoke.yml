name: Desktop E2E PR

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Regression suite to run
        required: true
        type: choice
        options: [smoke, full]
        default: smoke
      native_cache:
        description: Native resource cache; cold skips restore to benchmark a rebuild
        required: true
        type: choice
        options: [reuse, cold]
        default: reuse

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: desktop-e2e-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  gate:
    name: Select desktop E2E suite
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.select.outputs.run }}
      suite: ${{ steps.select.outputs.suite }}
    steps:
      - name: Select suite from trusted event metadata
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', 'true')
              core.setOutput('suite', context.payload.inputs?.suite === 'full' ? 'full' : 'smoke')
              return
            }

            const labels = new Set((context.payload.pull_request?.labels ?? []).map((label) => label.name))
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            })
            const criticalPrefixes = [
              'e2e/',
              'apps/electron/',
              'apps/cli/',
              'packages/components/',
              'packages/platform/',
              'packages/shared/',
              'packages/cli-supervisor/'
            ]
            const criticalFiles = new Set([
              'package.json',
              'pnpm-lock.yaml',
              'pnpm-workspace.yaml',
              '.github/workflows/e2e-smoke.yml',
              '.github/workflows/e2e-pr-reconcile.yml',
              '.github/workflows/e2e-daily.yml',
              '.github/workflows/e2e-daily-reconcile.yml'
            ])
            const critical = files.some(({ filename }) =>
              criticalFiles.has(filename) || criticalPrefixes.some((prefix) => filename.startsWith(prefix))
            )
            core.setOutput('run', String(critical || labels.has('e2e') || labels.has('e2e-full')))
            core.setOutput('suite', labels.has('e2e-full') ? 'full' : 'smoke')

  regression:
    name: Desktop E2E (${{ needs.gate.outputs.suite }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NATIVE_CACHE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.native_cache == 'cold' && 'cold' || 'reuse' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Initialize desktop source dependencies
        run: git submodule update --init packages/acp-extension-core packages/acp-extension-dsh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup browser driver toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0

      - name: Compute native resource cache keys
        id: native-cache-key
        run: node .github/scripts/desktop-native-cache.mjs key

      - name: Restore agent-browser native resource
        id: agent-browser-cache
        if: env.NATIVE_CACHE_MODE != 'cold'
        uses: actions/cache/restore@v4
        with:
          path: apps/electron/resources/agent-browser
          key: ${{ steps.native-cache-key.outputs.agent-browser }}

      - name: Restore browser-cookie-reader native resource
        id: browser-cookie-reader-cache
        if: env.NATIVE_CACHE_MODE != 'cold'
        uses: actions/cache/restore@v4
        with:
          path: apps/electron/resources/browser-cookie-reader
          key: ${{ steps.native-cache-key.outputs.browser-cookie-reader }}

      - name: Accept exact native resource cache restores
        env:
          NATIVE_CACHE_RESTORE_STARTED_AT: ${{ steps.native-cache-key.outputs.started-at }}
          AGENT_BROWSER_CACHE_KEY: ${{ steps.native-cache-key.outputs.agent-browser }}
          AGENT_BROWSER_CACHE_HIT: ${{ steps.agent-browser-cache.outputs.cache-hit }}
          AGENT_BROWSER_MATCHED_KEY: ${{ steps.agent-browser-cache.outputs.cache-matched-key }}
          BROWSER_COOKIE_READER_CACHE_KEY: ${{ steps.native-cache-key.outputs.browser-cookie-reader }}
          BROWSER_COOKIE_READER_CACHE_HIT: ${{ steps.browser-cookie-reader-cache.outputs.cache-hit }}
          BROWSER_COOKIE_READER_MATCHED_KEY: ${{ steps.browser-cookie-reader-cache.outputs.cache-matched-key }}
          PNPM_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
        run: node .github/scripts/desktop-native-cache.mjs accept-restore

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check suite contract
        run: pnpm --filter @molly/e2e check

      - name: Build OSS desktop and bundled CLI
        env:
          # CLI Vite SSR chunk rendering exceeds Node's default heap on macOS.
          NODE_OPTIONS: --max-old-space-size=8192
          MOLLY_NATIVE_BUILD_REPORT: ${{ runner.temp }}/molly-native-build-report.jsonl
        run: pnpm --dir apps/electron build

      - name: Test native resource cache contract
        run: node --test .github/scripts/desktop-native-cache.test.mjs apps/electron/scripts/native-resource-cache.test.mjs apps/electron/scripts/sign-embedded-harness.test.mjs

      - name: Verify native resources before cache save
        id: native-cache-verify
        env:
          MOLLY_NATIVE_BUILD_REPORT: ${{ runner.temp }}/molly-native-build-report.jsonl
        run: node .github/scripts/desktop-native-cache.mjs verify

      - name: Save agent-browser native resource
        if: steps.native-cache-verify.outputs.agent-browser-fresh == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: apps/electron/resources/agent-browser
          key: ${{ steps.native-cache-key.outputs.agent-browser }}

      - name: Save browser-cookie-reader native resource
        if: steps.native-cache-verify.outputs.browser-cookie-reader-fresh == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: apps/electron/resources/browser-cookie-reader
          key: ${{ steps.native-cache-key.outputs.browser-cookie-reader }}

      - name: Run selected desktop journeys
        shell: bash
        run: |
          set -o pipefail
          mkdir -p e2e/artifacts
          pnpm --filter @molly/e2e ${{ needs.gate.outputs.suite }} 2>&1 | tee e2e/artifacts/cucumber-output.log

      - name: Render failed journey videos
        if: failure()
        run: |
          pnpm --filter @molly/e2e exec playwright install ffmpeg
          pnpm --filter @molly/e2e failure:videos

      - name: Upload desktop E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-${{ needs.gate.outputs.suite }}-${{ github.run_id }}
          path: e2e/artifacts/
          if-no-files-found: warn
          retention-days: 14
