name: Pi update compatibility health
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  reassess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: 'main' });
            const overdue = prs.filter(pr => pr.user.login === 'dependabot[bot]' &&
              pr.head.ref.startsWith('dependabot/npm_and_yarn/pi-ecosystem-') &&
              Date.now() - Date.parse(pr.created_at) >= 3 * 24 * 60 * 60 * 1000);
            if (overdue.length) {
              await core.summary.addHeading('Pi updates need reassessment')
                .addList(overdue.map(pr => `${pr.html_url}: resolve the failed compatibility/gates or explicitly reconsider the blocking add-on. Essential adapters are never dropped automatically.`)).write();
              core.setFailed('Pi update has remained open for at least three days. Keep the last green set and reassess the blocking add-on.');
            }
