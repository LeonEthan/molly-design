name: Verify experimental MyGo macOS release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init packages/acp-extension-core packages/acp-extension-dsh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build workspace and fetch standalone Node
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup default 1.99.0
          pnpm install --frozen-lockfile
          pnpm build
          node scripts/fetch-standalone-node.mjs

      - name: Prepare temporary signing keychain
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/mygo-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          printf '%s' "$CSC_LINK" | base64 -D > "$RUNNER_TEMP/mygo.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/mygo.p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/mygo.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

      - name: Sign, notarize and assess experimental bundle
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/mygo-notary.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          unset APPLE_API_KEY_P8
          mkdir -p "$RUNNER_TEMP/mygo-report"
          node scripts/package-mygo-desktop.mjs --require-standalone-node --developer-id --notarize --out "$RUNNER_TEMP/mygo" > "$RUNNER_TEMP/mygo-report/bundle.json"
          plutil -convert json -o "$RUNNER_TEMP/mygo-report/info.json" "$RUNNER_TEMP/mygo/Molly Experimental.app/Contents/Info.plist"
      - name: Verify signed in-place keychain fixtures
        run: node scripts/verify-mygo-keychain-acl.mjs > "$RUNNER_TEMP/mygo-report/acl.json"

      - name: Remove temporary credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mygo.p12" "$RUNNER_TEMP/mygo-notary.p8"
          keychain="$RUNNER_TEMP/mygo-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mygo-macos-verification
          path: ${{ runner.temp }}/mygo-report/*.json
          if-no-files-found: error
